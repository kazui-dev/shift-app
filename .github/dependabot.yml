version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # These versions are coupled to Vite+ and are updated with its catalog.
      - dependency-name: "@vitest/*"
        versions: ["*"]
      - dependency-name: "vitest"
        versions: ["*"]
      # Match the Node major declared in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      tanstack-query:
        patterns:
          ["@tanstack/react-query", "@tanstack/react-query-persist-client"]
      vite-plus-toolchain:
        patterns:
          - vite
          - vite-plus
          - "@voidzero-dev/vite-plus-core"
          - vitest
          - "@vitest/*"
          - "@cloudflare/vite-plugin"
          - wrangler
          - "@vitejs/*"
          - "@tailwindcss/vite"
          - "@tanstack/router-plugin"
          - "@tanstack/react-router"
          - vite-plugin-pwa

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      vite-plus-actions:
        patterns:
          - "voidzero-dev/setup-vp"
