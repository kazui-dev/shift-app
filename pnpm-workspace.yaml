packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msw: false
  workerd: true
catalog:
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  "@vitest/coverage-v8": 5.0.1
  vitest: 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    # vite-plus-core is intentionally aliased as vite; its package version is
    # the Vite+ release rather than the embedded Vite release.
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
